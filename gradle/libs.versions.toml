[versions]
agp = "9.3.0"
coreKtx = "1.13.1"
activity = "1.8.2"
lifecycleRuntimeKtx = "2.6.1"
kotlin = "2.2.10"
appcompat = "1.6.1"
junit = "4.13.2"
bouncycastle = "1.79"
desugarJdkLibs = "2.1.5"
# Android 4.4 requires Media3 before 1.5; no manifest minimum-SDK override.
media3 = "1.4.1"

[libraries]
# jmDNS 以源码形式内嵌在 shared/src/main/java/javax/jmdns（KitKat 绑定时序修复，SO_REUSEADDR 先于 bind），此处仅保留其日志门面。
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version = "2.0.7" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
bouncycastle = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
